name: materialize-current-model

on:
  push:
    branches: [ cleanup-current-model ]
    paths:
      - '.upload_cli/READY3'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-current-model
          fetch-depth: 0

      - name: Reconstruct and verify Celltaminate.R
        shell: bash
        run: |
          set -euo pipefail
          wc -c .upload_cli/part00 .upload_cli/part01 .upload_cli/part02 .upload_cli/part03
          sha256sum .upload_cli/part00 .upload_cli/part01 .upload_cli/part02 .upload_cli/part03
          cat .upload_cli/part00 .upload_cli/part01 .upload_cli/part02 .upload_cli/part03 > /tmp/celltaminate.b64
          wc -c /tmp/celltaminate.b64
          base64 -d /tmp/celltaminate.b64 > /tmp/celltaminate.gz
          sha256sum /tmp/celltaminate.gz
          gzip -t /tmp/celltaminate.gz
          gzip -dc /tmp/celltaminate.gz > scripts/Celltaminate.R
          wc -c scripts/Celltaminate.R
          ACTUAL_HASH="$(git hash-object scripts/Celltaminate.R)"
          echo "Celltaminate.R Git blob: ${ACTUAL_HASH}"
          test "${ACTUAL_HASH}" = "90c837776a9b6599d848f3a5e637fd2b2829d774"
          rm -rf .upload_cli
          rm -rf .update_payload
          rm -f .github/workflows/materialize-cli.yml
          rm -f .github/workflows/materialize-current-model.yml

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/Celltaminate.R
          git add -u
          git commit -m 'Update current Celltaminate model'
          git push origin HEAD:cleanup-current-model
