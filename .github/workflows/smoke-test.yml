name: smoke-test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  wrapper-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check command-line launcher
        run: |
          python3 -m py_compile bin/celltaminate
          python3 bin/celltaminate --help
          python3 bin/celltaminate run --help
          python3 bin/celltaminate app --help
          python3 bin/celltaminate download-reference --help
      - name: Check R source syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core >/dev/null
          Rscript -e "parse(file='scripts/Celltaminate.R'); parse(file='app/Celltaminate_app.R')" >/dev/null
      - name: Check deployed model invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected_features = [
              "reads_support",
              "rpmm_support",
              "uniq_kmer_support",
              "ambiguity_species_nondominance",
              "reference_prevalence",
              "reference_median_abundance",
              "reference_relative_abundance",
              "reference_at_or_below_q99",
              "reference_at_or_below_q95",
              "reference_at_or_below_q50",
              "decontaminated_abundance",
              "decontamination_ratio",
              "kitome_clinical_overlap",
              "clinical_membership",
              "clinical_x_decon_support",
              "kitome_only_x_decon_support",
              "reference_prevalence_x_low_enrichment",
              "unresolved_ambiguity_x_kmer_support",
          ]

          forbidden = [
              "Likely true",
              "Likely false",
              "Uncertain",
              "is_control",
              "fp_falsepos_cutoff",
              "sample_priors",
              "js_divergence",
              "low_biomass_context",
              "reference_like_sample_composition",
              "kitome_overlap_x_decon_support",
              "species_nondominance_x_kmer_support",
              "kmer_per_read_support",
          ]

          model_blocks = []
          for path in [Path("scripts/Celltaminate.R"), Path("app/Celltaminate_app.R")]:
              text = path.read_text()
              for term in forbidden:
                  if term in text:
                      raise SystemExit(f"{path}: obsolete term remains: {term}")

              match = re.search(
                  r'final_score_model <- function\(\) \{\s*feature_names <- c\((.*?)\)\s*\n\s*list\(',
                  text,
                  flags=re.S,
              )
              if not match:
                  raise SystemExit(f"{path}: final_score_model feature list not found")

              features = re.findall(r'"([^"]+)"', match.group(1))
              if features != expected_features:
                  raise SystemExit(f"{path}: deployed feature list differs from expected 18-term model: {features}")

              if 'fp_true_flag ~ "Prioritized"' not in text:
                  raise SystemExit(f"{path}: prioritized binary call is missing")
              if 'TRUE ~ "Not prioritized"' not in text:
                  raise SystemExit(f"{path}: not-prioritized binary call is missing")

              start = text.index("final_score_model <- function()")
              end = text.index("compute_ambiguity_index <- function(", start)
              model_blocks.append(text[start:end].strip())

          if model_blocks[0] != model_blocks[1]:
              raise SystemExit("CLI and Shiny deployed-model definitions differ")

          print("Validated R syntax, 18-term model, binary calls, and CLI/Shiny model identity.")
          PY
      - name: Dry-run bundled example
        run: |
          python3 bin/celltaminate run \
            --input-list examples/lung_nanopore/input_list.txt \
            --metadata examples/lung_nanopore/metadata.tsv \
            --outdir /tmp/celltaminate_dry_run \
            --dry-run
