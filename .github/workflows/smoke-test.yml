name: smoke-test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  wrapper-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check command-line launcher
        run: |
          python3 -m py_compile bin/celltaminate
          python3 bin/celltaminate --help
          python3 bin/celltaminate run --help
          python3 bin/celltaminate app --help
          python3 bin/celltaminate download-reference --help
      - name: Dry-run bundled example
        run: |
          python3 bin/celltaminate run \
            --input-list examples/lung_nanopore/input_list.txt \
            --metadata examples/lung_nanopore/metadata.tsv \
            --outdir /tmp/celltaminate_dry_run \
            --dry-run
