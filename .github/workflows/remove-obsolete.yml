name: remove-obsolete

on:
  push:
    branches: [ cleanup-current-model ]
    paths:
      - '.remove_obsolete_trigger'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-current-model
          fetch-depth: 0

      - name: Remove obsolete scoring and control-sample code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('scripts/Celltaminate.R'), Path('app/Celltaminate_app.R')]

          def clean_r(path):
              t = path.read_text()

              # Binary terminology used throughout the current software.
              t = t.replace('Likely false positive / background', 'Not prioritized')
              t = t.replace('Likely false positive/background', 'Not prioritized')
              t = t.replace('Likely true', 'Prioritized')
              t = t.replace('Uncertain', 'Not prioritized')
              t = t.replace('likely false positive / background', 'not prioritized')
              t = t.replace('likely false positive/background', 'not prioritized')
              t = t.replace('likely true', 'prioritized')
              t = t.replace('uncertain', 'not prioritized')

              # Call bucket helpers: exactly two categories.
              t = re.sub(
                  r'call_bucket_label <- function\(call\) \{.*?CALL_PALETTE <- c\(.*?\)\n',
                  '''call_bucket_label <- function(call) {\n  dplyr::case_when(\n    call == "Prioritized" ~ "Prioritized",\n    TRUE ~ "Not prioritized"\n  )\n}\n\nCALL_BUCKET_LEVELS <- c(\n  "Prioritized",\n  "Not prioritized"\n)\n\nCALL_PALETTE <- c(\n  "Prioritized" = "#2E7D32",\n  "Not prioritized" = "#8B0000"\n)\n''',
                  t, flags=re.S
              )

              # Remove user-supplied control-sample prevalence block.
              t = re.sub(
                  r'\n  control_samples <- character\(0\).*?\n  base_filt <-',
                  '\n  use_cohort_prevalence <- is.finite(n_samples) && n_samples >= 3\n\n  base_filt <-',
                  t, flags=re.S
              )
              t = re.sub(
                  r'\n  if \(n_controls > 0\) \{.*?\n  \}\n\n  tax_cor <-',
                  '\n\n  tax_cor <-',
                  t, flags=re.S
              )
              t = t.replace(
                  'mutate(bg_rpmm = pmax(coalesce0(median_rpmm_control_detected), coalesce0(ref_med_rpmm), coalesce0(cohort_bg_rpmm)))',
                  'mutate(bg_rpmm = pmax(coalesce0(ref_med_rpmm), coalesce0(cohort_bg_rpmm)))'
              )

              # Remove obsolete control-derived output fields and metadata flag.
              for pat in [
                  r'^.*control_prevalence.*\n',
                  r'^.*mean_rpmm_control_detected.*\n',
                  r'^.*median_rpmm_control_detected.*\n',
                  r'^.*control_median_rpmm.*\n',
                  r'^.*log2FC_vs_control_median.*\n',
                  r'^.*enriched_vs_controls.*\n',
                  r'^.*is_control.*\n',
              ]:
                  t = re.sub(pat, '', t, flags=re.M)

              # Binary score assignment. Score <= threshold is prioritized; all other microbial taxa are not prioritized.
              t = re.sub(
                  r'\n      fp_falsepos_flag =\n        fp_score >=\n        params\$fp_falsepos_cutoff,?',
                  '', t
              )
              t = re.sub(
                  r'call = case_when\(\n        !is_microbial \| is_host \| is_plant ~ "Non-microbial / Host",.*?\n      \),\n      call_reason = case_when\(.*?\n      \)\n    \)',
                  '''call = case_when(\n        !is_microbial | is_host | is_plant ~ "Non-microbial / Host",\n        fp_true_flag ~ "Prioritized",\n        TRUE ~ "Not prioritized"\n      ),\n      call_reason = case_when(\n        !is_microbial | is_host | is_plant ~ "Excluded as non-microbial or host",\n        call == "Prioritized" ~ paste0(\n          "Score ", round(fp_score, 1),\n          " <= prioritization cutoff ", round(params$fp_true_cutoff, 1)\n        ),\n        TRUE ~ paste0(\n          "Score ", round(fp_score, 1),\n          " > prioritization cutoff ", round(params$fp_true_cutoff, 1)\n        )\n      )\n    )''',
                  t, flags=re.S
              )

              # Remove obsolete upper cutoff parameter wherever it is defined.
              t = re.sub(r'^.*fp_falsepos_cutoff.*\n', '', t, flags=re.M)

              # Remove obsolete three-category cleaned-report selector and use the binary call directly.
              t = re.sub(
                  r'compute_remove_taxa_for_sample <- function\(gs, quick, protected_taxa = character\(0\)\) \{.*?\n\}',
                  '''compute_remove_taxa_for_sample <- function(gs, protected_taxa = character(0)) {\n  remove_taxa <- gs$name_clean[gs$call == "Not prioritized"]\n  remove_taxa <- unique(remove_taxa)\n  remove_taxa <- remove_taxa[!is.na(remove_taxa) & nzchar(remove_taxa)]\n  setdiff(remove_taxa, protected_taxa)\n}''',
                  t, flags=re.S
              )
              t = t.replace('call == "Prioritized")', 'call == "Prioritized")')
              t = t.replace('build_cleaned_report_for_sample <- function(raw_df, gs, quick, protected_taxa = character(0), keep_descendants = FALSE) {',
                            'build_cleaned_report_for_sample <- function(raw_df, gs, protected_taxa = character(0), keep_descendants = FALSE) {')
              t = t.replace('compute_remove_taxa_for_sample(gs, quick = quick, protected_taxa = protected_taxa)',
                            'compute_remove_taxa_for_sample(gs, protected_taxa = protected_taxa)')
              t = re.sub(r'write_cleaned_reports <- function\(result, out_dir, quick = c\("false", "unc"\),\n\s*protected_taxa_map',
                         'write_cleaned_reports <- function(result, out_dir,\n                                  protected_taxa_map', t)
              t = re.sub(r'^\s*quick = quick,\n', '', t, flags=re.M)
              t = re.sub(r'^\s*quick_remove <- .*\n', '', t, flags=re.M)
              t = re.sub(r'^\s*quick = quick_remove,\n', '', t, flags=re.M)
              t = re.sub(r'^.*quick_remove.*\n', '', t, flags=re.M)

              # Metadata now contains sample, group, and sample_type only.
              t = re.sub(
                  r'default_metadata <- function\(sample_names\) \{.*?\n\}',
                  '''default_metadata <- function(sample_names) {\n  tibble(\n    sample = as.character(sample_names),\n    group = "Group 1",\n    sample_type = "Clinical / sterile"\n  )\n}''',
                  t, flags=re.S
              )

              # Clean duplicate binary branches created by terminology replacement.
              t = re.sub(r'\n\s*call == "Not prioritized" ~ 3,', '', t)
              t = re.sub(r'\n\s*call == "Not prioritized" ~ "Not prioritized",\n\s*TRUE ~ "Not prioritized"', '\n    TRUE ~ "Not prioritized"', t)

              # Current summary field names.
              t = t.replace('n_true', 'n_prioritized')
              t = t.replace('n_uncertain', 'n_not_prioritized')
              t = t.replace('n_contaminant', 'n_not_prioritized_background')

              path.write_text(t)

          for f in files:
              clean_r(f)
          PY

      - name: Clean command-line wrapper and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('bin/celltaminate')
          t = p.read_text()
          t = t.replace('required = {"sample", "group", "sample_type", "is_control"}', 'required = {"sample", "group", "sample_type"}')
          t = t.replace('"sample\\tgroup\\tsample_type\\tis_control\\n"', '"sample\\tgroup\\tsample_type\\n"')
          t = t.replace('"sample1.kraken.report.txt\\tGroup 1\\tClinical\\tFALSE\\n",', '"sample1.kraken.report.txt\\tGroup 1\\tClinical\\n",')
          t = re.sub(r'^\s*"--fp_falsepos_cutoff".*\n', '', t, flags=re.M)
          t = re.sub(r'^\s*"--quick_remove".*\n', '', t, flags=re.M)
          t = re.sub(r'^\s*run\.add_argument\("--fp-falsepos-cutoff".*\n', '', t, flags=re.M)
          t = re.sub(r'^\s*run\.add_argument\("--quick-remove".*\n', '', t, flags=re.M)
          p.write_text(t)

          Path('README.md').write_text('''# Celltaminate\n\n**Celltaminate** is an R-based command-line and Shiny application for contamination-aware prioritization of microbial taxa from host-dominated sequencing data.\n\nCelltaminate starts from Kraken2 or KrakenUniq taxonomic reports and integrates sequence support, taxonomic ambiguity, sterile-reference background, decontamination, and curated clinical-pathogen and kitome/background evidence into a continuous score from 0 to 100.\n\nLower scores indicate stronger support for prioritization. The default operating rule is:\n\n```text\nscore <= 1    prioritized\nscore > 1     not prioritized\n```\n\nThe score is a logistic mapping of the fitted regularized model and is not a calibrated probability.\n\n## Installation\n\n```bash\ngit clone https://github.com/as4184/Celltaminate.git\ncd Celltaminate\nconda env create -f environment.yml\nconda activate celltaminate\nbin/celltaminate --help\n```\n\nDownload the sterile-reference background table:\n\n```bash\nbin/celltaminate download-reference\n```\n\nReference DOI: `10.5281/zenodo.20560460`\n\n## Quick start\n\n```bash\nbash examples/lung_nanopore/run_example.sh\n```\n\nRun on your own reports:\n\n```bash\nbin/celltaminate run \\\n  --reports sample1.kraken.report.txt sample2.kraken.report.txt \\\n  --outdir celltaminate_results\n```\n\nOptional metadata can be supplied with `--metadata metadata.tsv`. The metadata table contains `sample`, `group`, and `sample_type`; no user-supplied control designation is used.\n\n## Shiny application\n\n```bash\nbin/celltaminate app\n```\n\n## Input\n\nCelltaminate accepts Kraken2 6-column reports, Kraken2 8-column reports with minimizer data, and KrakenUniq 8-column reports. Eight-column reports are preferred because unique k-mer/minimizer support is part of the fitted scoring model.\n\n## Output\n\nThe primary per-sample tables report taxon-level evidence, the Celltaminate score, and the binary call `Prioritized` or `Not prioritized`.\n\n## Documentation\n\n- [Installation](docs/installation.md)\n- [Quick start](docs/quickstart.md)\n- [Input formats](docs/input_formats.md)\n- [Output files](docs/output_files.md)\n- [Reference data](docs/reference_data.md)\n- [Score interpretation](docs/scoring.md)\n- [Shiny application](docs/shiny_app.md)\n- [Troubleshooting](docs/troubleshooting.md)\n\n## Citation metadata\n\nSee [`CITATION.cff`](CITATION.cff).\n\n## License\n\nSee [`LICENSE.md`](LICENSE.md).\n''')

          Path('docs/scoring.md').write_text('''# Score interpretation\n\nCelltaminate reports a score from 0 to 100 for each retained genus- or species-level taxon. Lower scores indicate stronger support for prioritization, whereas higher scores indicate stronger background-like evidence.\n\nThe deployed model integrates retained terms from abundance, unique k-mer support, taxonomic ambiguity, sterile-reference background, decontamination, curated clinical-pathogen and kitome/background membership, and selected interactions between these evidence layers.\n\nThe default operating rule is:\n\n```text\nscore <= 1    prioritized\nscore > 1     not prioritized\n```\n\nThe prioritization threshold can be changed with `--fp-true-cutoff`. Changing the threshold changes the binary call but does not change the underlying Celltaminate score.\n\nExample:\n\n```bash\nbin/celltaminate run \\\n  --input-list input_list.txt \\\n  --outdir results \\\n  --fp-true-cutoff 1\n```\n\nThe Celltaminate score is a logistic mapping of the fitted regularized model and should not be interpreted as a calibrated probability.\n''')

          Path('docs/input_formats.md').write_text('''# Input formats\n\n## Kraken reports\n\nCelltaminate accepts Kraken2 6-column reports, Kraken2 8-column reports with minimizer data, and KrakenUniq 8-column reports. The original indentation of taxon names must be preserved because it is used to reconstruct the taxonomic lineage. Eight-column reports are preferred because the fitted score uses unique k-mer/minimizer support.\n\n## Input list\n\n`input_list.txt` contains one report path per line:\n\n```text\nsample1.kraken.report.txt\nsample2.kraken.report.txt\n```\n\nRelative paths are interpreted relative to the input-list location.\n\n## Metadata\n\nMetadata are optional and tab-separated:\n\n```text\nsample\tgroup\tsample_type\nsample1.kraken.report.txt\tCase\tNanopore\nsample2.kraken.report.txt\tCase\tNanopore\n```\n\nColumns:\n\n- `sample`: report basename;\n- `group`: biological or study group;\n- `sample_type`: sample or sequencing description.\n\nCelltaminate does not use a user-supplied control-sample designation. Background evidence is derived from the bundled/reference background resources and the model features.\n''')

          Path('docs/output_files.md').write_text('''# Output files\n\nA Celltaminate run writes tables, plots, optional cleaned reports, and a run summary.\n\nThe main taxon-level outputs are in `output_dir/tables/per_sample/`. Important columns include taxon name, clade reads, RPM, RPMM, decontaminated RPMM, `Celltaminate_Score`, and the binary `Call`.\n\nThe binary call is:\n\n```text\nscore <= 1    Prioritized\nscore > 1     Not prioritized\n```\n\nCleaned Kraken-style reports retain prioritized taxa by default. The original taxonomic report is not modified.\n''')

          Path('docs/shiny_app.md').write_text('''# Shiny application\n\nLaunch the application with:\n\n```bash\nbin/celltaminate app\n```\n\nThe application allows users to upload Kraken2 or KrakenUniq reports, choose genus- or species-level analysis, adjust the prioritization threshold, inspect binary prioritized/not-prioritized results, and review abundance, score, taxonomy, and curated contextual information.\n\nThe bundled kitome/background and clinical-pathogen panels are loaded automatically. The reference background table is loaded automatically when `data/reference/refined_cell.lines.tsv` is present.\n\nNo user-supplied control-sample designation is required or used.\n''')

          # Example metadata: remove the obsolete is_control column.
          m = Path('examples/lung_nanopore/metadata.tsv')
          if m.exists():
              rows = [line.split('\t') for line in m.read_text().splitlines()]
              if rows and 'is_control' in rows[0]:
                  idx = rows[0].index('is_control')
                  rows = [[x for j,x in enumerate(r) if j != idx] for r in rows]
                  m.write_text('\n'.join('\t'.join(r) for r in rows) + '\n')
          PY

      - name: Validate syntax and obsolete-pattern removal
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/celltaminate
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core >/dev/null
          Rscript -e "parse(file='scripts/Celltaminate.R'); parse(file='app/Celltaminate_app.R')" >/dev/null
          if grep -RniE --exclude-dir=.git --exclude='*.tsv' --exclude='remove-obsolete.yml' --exclude='audit-obsolete.yml' \
            'Likely true|Likely false|Uncertain|three-tier|fp_falsepos_cutoff|fp-falsepos-cutoff|is_control|control_prevalence|control_median|mean_rpmm_control|median_rpmm_control|quick_remove|quick-remove' \
            README.md docs bin scripts app examples; then
            echo 'Obsolete patterns remain.' >&2
            exit 1
          fi

      - name: Remove temporary audit files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .audit_obsolete_trigger .remove_obsolete_trigger
          rm -f .github/workflows/audit-obsolete.yml .github/workflows/remove-obsolete.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete scoring and control-sample paths'
          git push origin HEAD:cleanup-current-model
