name: Bug report
description: Report a reproducible Celltaminate problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      description: Paste the exact command, after replacing local paths or sample identifiers if needed.
      render: bash
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: R version, operating system, conda/container information.
    validations:
      required: false
